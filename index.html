<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weight Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="wrapper">
    <h1>🏋️‍♂️ Weight Tracker</h1>

    <div class="input-section">
      <input type="number" id="weightInput" placeholder="Enter weight (kg)" />
      <button id="addBtn">Add</button>
    </div>

    <div class="stats">
      <div class="list-card">
        <h3>Last 3 Days</h3>
        <ul id="lastWeights">
          <li class="empty">No data yet</li>
        </ul>
      </div>

      <div class="card highest-card">
        <h3>Highest</h3>
        <p id="highestWeight">--</p>
      </div>

      <div class="card lowest-card">
        <h3>Lowest</h3>
        <p id="lowestWeight">--</p>
      </div>
    </div>

    <footer>
      <span>Data saved locally •</span>
      <button id="resetBtn" class="reset-btn">🔁</button>
    </footer>

  </div>

  <script src="script.js"></script>
</body>

</html>
